  <rect width="64" height="64" rx="14" fill="#0e1016"/>
  <!-- rays first: their end caps land on the prism faces, and the prism stroke
       painted after them covers the overlap so they appear absorbed -->
  <path d="M6 33 L23.08 33" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M40.92 33 L56.4 25.78" stroke="#9aa8ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M40.92 33 L56.4 40.22" stroke="#5a68d8" stroke-width="3" stroke-linecap="round"/>
  <path d="M40.92 33 L58 33" stroke="#7c8cff" stroke-width="3" stroke-linecap="round"/>
  <!-- prism: equilateral, side 34 -->
  <path d="M32 17.56 L49 47 L15 47 Z" fill="none" stroke="#7c8cff" stroke-width="3" stroke-linejoin="round"/>
  <!-- heart on the prism (same as the TV Time mark, scaled to fit) -->
  <path d="M32 45 C 24 40 22 36 22 33 C 22 30.5 24 29 26.5 29 C 28.5 29 30.5 30.5 32 32.5 C 33.5 30.5 35.5 29 37.5 29 C 40 29 42 30.5 42 33 C 42 36 40 40 32 45 Z"
        fill="#7c8cff" transform="translate(32 36.7) scale(0.6) translate(-32 -37)"/>
</svg>
